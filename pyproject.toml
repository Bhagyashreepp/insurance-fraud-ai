[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-fraud-ai"
version = "0.1.0"
description = "Synthetic insurance-claim data generation MVP"
requires-python = ">=3.11"
dependencies = [
  "Faker>=25,<38",
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "openai>=1,<3",
  "pandas>=2.1,<3",
  "pydantic>=2,<3",
  "pyarrow>=16,<24",
  "scikit-learn>=1.4,<2",
  "sentence-transformers>=3,<6",
  "SQLAlchemy>=2.0,<3",
  "streamlit>=1.37,<2",
  "uvicorn>=0.30,<1",
  "xgboost>=2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
